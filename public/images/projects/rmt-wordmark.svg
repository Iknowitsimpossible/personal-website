<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="160 80 680 340" fill="none">
  <title>Rate My Teacher</title>
  <desc>The Rate My Teacher wordmark: "Rate my" in white on a dark block, joined to "Teacher" in dark on white.</desc>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="5" text-anchor="middle" dominant-baseline="central">
    <rect x="250" y="210" width="250" height="80" fill="#27333c" />
    <rect x="500" y="210" width="250" height="80" fill="#fff" stroke="#27333c" stroke-width="3" />
    <rect x="250" y="210" width="500" height="80" stroke="#27333c" stroke-width="3" />
    <text x="377" y="251" fill="#fff">RATE MY</text>
    <text x="627" y="251" fill="#27333c">TEACHER</text>
  </g>
</svg>
